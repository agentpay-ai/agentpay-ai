name: AgentPay AI CI Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  web-build:
    name: Build Next.js MiniApp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'apps/web/package.json'
      - name: Install dependencies
        run: |
          cd apps/web
          npm ci
      - name: Build Next.js
        run: |
          cd apps/web
          npm run build

  api-build:
    name: Validate Hono API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'apps/api/package.json'
      - name: Install dependencies
        run: |
          cd apps/api
          npm ci
      - name: Typecheck Hono API
        run: |
          cd apps/api
          npx tsc --noEmit

  contracts-test:
    name: Test Foundry Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - name: Run forge build & test
        run: |
          cd contracts
          forge --version
          forge build
          forge test
