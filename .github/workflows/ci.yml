name: AgentPay AI CI Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  web-build:
    name: Build Next.js MiniApp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          cd apps/web
          npm install
      - name: Build Next.js
        run: |
          cd apps/web
          npm run build

  api-build:
    name: Validate Hono API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          cd apps/api
          npm install
      - name: Typecheck Hono API
        run: |
          cd apps/api
          npx tsc --noEmit

  gemini-test:
    name: Validate Gemini Flash & AI Routes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          cd apps/api
          npm install
      - name: Run Gemini Unit Test Suite
        run: |
          cd apps/api
          npm run test:gemini

  erc8004-test:
    name: Validate ERC-8004 Agent Identity & Schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          cd apps/api
          npm install
      - name: Run ERC-8004 Schema Test Suite
        run: |
          cd apps/api
          npm run test:erc8004

  erc8021-test:
    name: Validate ERC-8021 Attribution Tags & Proof of Ship Tracking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          cd apps/api
          npm install
      - name: Run ERC-8021 Attribution Test Suite
        run: |
          cd apps/api
          npm run test:erc8021

  ui-test:
    name: Validate Mobile Frontend & AI Tool Workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          cd apps/api
          npm install
      - name: Run UI Integration Test Suite
        run: |
          cd apps/api
          npm run test:ui

  contracts-test:
    name: Test Foundry Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - name: Install OpenZeppelin dependencies if missing
        run: |
          cd contracts
          if [ ! -d "lib/openzeppelin-contracts" ]; then
            forge install openzeppelin/openzeppelin-contracts
          fi
      - name: Run forge build & test
        run: |
          cd contracts
          forge --version
          forge build
          forge test
